<style>
  .aafig { margin: 1.5rem 0; --text-secondary: var(--text-muted); }
  .aafig .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .aafig .rowlbl { font-size: 13px; color: var(--text-secondary,#73726c); width: 16px; }
  .aafig .rowval { font-size: 13px; font-weight: 500; min-width: 44px; text-align: right; }
  .aafig .aabg { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 0.75rem 1rem; }
  .aafig figcaption { font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem; }
</style>

<figure class="aafig">
  <h2 class="sr-only">Interactive sphere with axis-angle rotation controls: three sliders set where a red dot points on the sphere, normalized to a unit vector, and a fourth slider rotates the sphere by a chosen angle about that axis. The dot stays fixed while the rest of the sphere spins around it.</h2>
  <div class="aabg">
    <div style="text-align:center">
      <svg id="rs" width="100%" viewBox="0 0 680 460" role="img" aria-label="Sphere with fixed X Y Z reference axes, a rotation axis line, and a red dot marking that axis on the surface">
        <circle cx="340" cy="220" r="150" fill="none" stroke="var(--text-secondary,#73726c)" stroke-width="1" opacity="0.3"/>
        <g id="wire"></g>
        <line id="ax-x" stroke="#D85A30" stroke-width="1.5" opacity="0.55"/>
        <line id="ax-y" stroke="#639922" stroke-width="1.5" opacity="0.55"/>
        <line id="ax-z" stroke="#378ADD" stroke-width="1.5" opacity="0.55"/>
        <line id="ax-rot" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85"/>
        <circle id="dot" r="6" fill="#E24B4A" stroke="#791F1F" stroke-width="1"/>
      </svg>
    </div>
    <div style="display:flex;gap:14px;justify-content:center;margin:2px 0 14px;font-size:12px;color:var(--text-muted,#888780)">
      <span><span style="color:#D85A30">&#9679;</span> X</span><span><span style="color:#639922">&#9679;</span> Y</span><span><span style="color:#378ADD">&#9679;</span> Z</span><span><span style="color:#7F77DD">&#9679;</span> rotation axis</span>
    </div>
    <div style="max-width:460px;margin:0 auto">
      <div style="font-size:13px;color:var(--text-secondary,#73726c);margin-bottom:4px">Where the red dot points (normalized automatically)</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="rowlbl">x</span><input type="range" id="sx" min="-1" max="1" step="0.01" value="0" style="flex:1" oninput="update()"><span class="rowval" id="ox">0.00</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="rowlbl">y</span><input type="range" id="sy" min="-1" max="1" step="0.01" value="1" style="flex:1" oninput="update()"><span class="rowval" id="oy">1.00</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span class="rowlbl">z</span><input type="range" id="sz" min="-1" max="1" step="0.01" value="0" style="flex:1" oninput="update()"><span class="rowval" id="oz">0.00</span></div>
      <div style="font-size:13px;color:var(--text-secondary,#73726c);margin-bottom:4px">Rotation about that axis</div>
      <div style="display:flex;align-items:center;gap:10px"><span class="rowlbl">&#952;</span><input type="range" id="st" min="0" max="360" step="1" value="0" style="flex:1" oninput="update()"><span class="rowval" id="ot">0&#176;</span></div>
    </div>
  </div>
  <figcaption>An <em>axis–angle</em> rotation: a unit vector (x, y, z) picks the rotation axis (dashed purple), and the angle θ ∈ [0°, 360°] spins the whole sphere about it. The red dot on the axis stays fixed while the grid rotates — exactly the "point the dot, then spin about it" degrees of freedom from above.</figcaption>
</figure>

<script>
(function(){
  var wire=document.getElementById('wire'),dot=document.getElementById('dot');
  var NS='http://www.w3.org/2000/svg';
  var cx=340,cy=220,R=150;
  function rotX(t){var c=Math.cos(t),s=Math.sin(t);return [1,0,0, 0,c,-s, 0,s,c];}
  function rotY(t){var c=Math.cos(t),s=Math.sin(t);return [c,0,s, 0,1,0, -s,0,c];}
  function matMul(a,b){var r=[];for(var i=0;i<3;i++)for(var j=0;j<3;j++){var s=0;for(var k=0;k<3;k++)s+=a[i*3+k]*b[k*3+j];r.push(s);}return r;}
  function apply(m,p){return [m[0]*p[0]+m[1]*p[1]+m[2]*p[2], m[3]*p[0]+m[4]*p[1]+m[5]*p[2], m[6]*p[0]+m[7]*p[1]+m[8]*p[2]];}
  function rodrigues(a,th){var c=Math.cos(th),s=Math.sin(th),t=1-c,x=a[0],y=a[1],z=a[2];return [t*x*x+c,t*x*y-s*z,t*x*z+s*y, t*x*y+s*z,t*y*y+c,t*y*z-s*x, t*x*z-s*y,t*y*z+s*x,t*z*z+c];}
  var Mview=matMul(rotX(-0.32),rotY(0.55));
  function screen(m,p){var rp=apply(m,p);return {x:cx+rp[0]*R,y:cy-rp[1]*R,z:rp[2]};}
  function setLine(el,a,b){el.setAttribute('x1',a.x.toFixed(1));el.setAttribute('y1',a.y.toFixed(1));el.setAttribute('x2',b.x.toFixed(1));el.setAttribute('y2',b.y.toFixed(1));}
  var ax=screen(Mview,[-1,0,0]),bx=screen(Mview,[1,0,0]);setLine(document.getElementById('ax-x'),ax,bx);
  var ay=screen(Mview,[0,-1,0]),by=screen(Mview,[0,1,0]);setLine(document.getElementById('ax-y'),ay,by);
  var az=screen(Mview,[0,0,-1]),bz=screen(Mview,[0,0,1]);setLine(document.getElementById('ax-z'),az,bz);
  function latRing(colatDeg,n){var pts=[],phi=colatDeg*Math.PI/180,r=Math.sin(phi),y=Math.cos(phi);for(var i=0;i<=n;i++){var t=(i/n)*2*Math.PI;pts.push([r*Math.cos(t),y,r*Math.sin(t)]);}return pts;}
  function meridian(azDeg,n){var pts=[],psi=azDeg*Math.PI/180;for(var i=0;i<=n;i++){var u=(i/n)*2*Math.PI;pts.push([Math.sin(u)*Math.cos(psi),Math.cos(u),Math.sin(u)*Math.sin(psi)]);}return pts;}
  var N=24,lats=[30,60,90,120,150],longs=[0,30,60,90,120,150],segments=[];
  function addCircle(pts,bold){for(var i=0;i<pts.length-1;i++){var el=document.createElementNS(NS,'line');el.setAttribute('stroke','var(--text-secondary,#73726c)');el.setAttribute('stroke-width',bold?'1':'0.6');wire.appendChild(el);segments.push({p0:pts[i],p1:pts[i+1],el:el});}}
  lats.forEach(function(d){addCircle(latRing(d,N),d===90);});
  longs.forEach(function(d){addCircle(meridian(d,N),false);});
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  var axRotEl=document.getElementById('ax-rot');
  window.update=function(){
    var rx=parseFloat(document.getElementById('sx').value),ry=parseFloat(document.getElementById('sy').value),rz=parseFloat(document.getElementById('sz').value);
    var len=Math.sqrt(rx*rx+ry*ry+rz*rz);if(len<1e-4){rx=0;ry=1;rz=0;len=1;}
    var n=[rx/len,ry/len,rz/len];
    document.getElementById('ox').textContent=n[0].toFixed(2);document.getElementById('oy').textContent=n[1].toFixed(2);document.getElementById('oz').textContent=n[2].toFixed(2);
    var thetaDeg=parseFloat(document.getElementById('st').value);document.getElementById('ot').textContent=thetaDeg.toFixed(0)+'\u00B0';
    var theta=thetaDeg*Math.PI/180;
    var Robj=rodrigues(n,theta);
    var Mtot=matMul(Mview,Robj);
    for(var i=0;i<segments.length;i++){var s=segments[i];var a=screen(Mtot,s.p0),b=screen(Mtot,s.p1);var op=clamp(0.12+(((a.z+b.z)/2)+1)/2*0.65,0.1,0.78);setLine(s.el,a,b);s.el.setAttribute('stroke-opacity',op.toFixed(2));}
    var d=screen(Mtot,n);dot.setAttribute('cx',d.x.toFixed(1));dot.setAttribute('cy',d.y.toFixed(1));
    var na=screen(Mview,[-n[0],-n[1],-n[2]]),nb=screen(Mview,n);setLine(axRotEl,na,nb);
  };
  update();
})();
</script>
